        - paragraph [ref=e818]:
          - strong [ref=e819]: Tandem AI
        - paragraph [ref=e820]:
          - text: Tandem AI lets two models cooperate on tasks — a
          - strong [ref=e821]: Planning / Reasoning
          - text: model handles analysis, architecture, and review while an
          - strong [ref=e822]: Implementation / Coder
          - text: model handles code writing, edits, and validation loops.
        - paragraph [ref=e823]:
          - strong [ref=e824]: How It Works
        - paragraph [ref=e825]:
          - text: The planner model starts every conversation. When it has a detailed plan ready, it calls the
          - code [ref=e826]: switch_model
          - text: tool to hand off to the coder. The coder implements the plan, validates the code, then switches back to the planner for review. The models self-route — no heuristic decides for them.
        - paragraph [ref=e827]:
          - text: Both models see the full conversation history, so handoff is seamless. The
          - code [ref=e828]: switch_model
          - text: tool call itself documents the transition in the message history.
        - paragraph [ref=e829]:
          - strong [ref=e830]: Setting Up
        - list [ref=e831]:
          - listitem [ref=e832]:
            - generic [ref=e834]: "1."
            - paragraph [ref=e836]:
              - text: In
              - strong [ref=e837]: Settings → Chatbot
              - text: ", add your planning model to the"
              - strong [ref=e838]: Planning / Reasoning
              - text: model list (e.g.
              - code [ref=e839]: anthropic/claude-sonnet-4
              - text: )
          - listitem [ref=e840]:
            - generic [ref=e842]: "2."
            - paragraph [ref=e844]:
              - text: Add your coding model to the
              - strong [ref=e845]: Implementation / Coder
              - text: model list (e.g.
              - code [ref=e846]: google/gemini-2.5-flash
              - text: )
          - listitem [ref=e847]:
            - generic [ref=e849]: "3."
            - paragraph [ref=e851]: Select the desired model from each dropdown at the bottom of the chat panel

              - text: — set a different API key for the coder model
        - paragraph [ref=e877]: Leave these empty to use the planner's endpoint. These fields are only available on the Default provider — GitHub and Copilot providers use a single endpoint for all models.
        - paragraph [ref=e878]:
          - strong [ref=e879]: Tips
        - list [ref=e880]:
          - listitem [ref=e881]:
            - generic [ref=e883]: •
            - paragraph [ref=e885]: The planner sets the quality ceiling. A thorough plan with exact files, functions, and changes lets even a cheap coder model execute precisely
          - listitem [ref=e886]:
            - generic [ref=e888]: •
            - paragraph [ref=e890]: Use a strong model for planning (Claude, GPT-4, etc.) and a fast/cheap model for coding (Gemini Flash, Qwen Coder, etc.) to balance quality and cost
          - listitem [ref=e891]:
            - generic [ref=e893]: •
            - paragraph [ref=e895]: The planner is instructed to read code before planning, produce detailed plans with exact changes, and include edge cases and validation steps
          - listitem [ref=e896]:
            - generic [ref=e898]: •
            - paragraph [ref=e900]: The coder is instructed to work autonomously through the full implementation and only switch back when done, when hitting an unplanned design decision, or after 5+ validation failures
        - separator [ref=e901]
        - paragraph [ref=e902]:
          - strong [ref=e903]: AI Tool Use
        - paragraph [ref=e904]:
          - text: The AI doesn't just chat — it can take actions. When
          - strong [ref=e905]: Enable Tool Calls
          - text: is checked in settings, the AI has access to
          - strong [ref=e906]: 65+ tools
          - text: and loops automatically until the task is done (up to the configurable
          - strong [ref=e907]: Tool Loop Limit
          - text: ). Heavy reverse engineering tools run asynchronously on a background thread, keeping the UI responsive during multi-second scans. The AI keeps full context during its working session — trimming only happens after the assistant fully completes.

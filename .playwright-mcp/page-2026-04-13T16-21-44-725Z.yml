          - strong [ref=e460]: AI Chat
        - paragraph [ref=e461]: The editor includes a full AI chat panel with built-in support for three API providers, plus any custom OpenAI-compatible endpoint.
        - paragraph [ref=e462]:
          - strong [ref=e463]: Providers
        - paragraph [ref=e464]:
          - text: The
          - strong [ref=e465]: Settings → Chatbot → Provider
          - text: section lets you choose between three provider modes. Each provider has completely independent settings — switching providers never overwrites another provider's configuration.
        - list [ref=e466]:
          - listitem [ref=e467]:
            - generic [ref=e469]: •
            - paragraph [ref=e471]:
              - strong [ref=e472]: Default
              - text: — connect to any OpenAI-compatible API endpoint. Enter a URL, API key, and model name manually. Works with OpenRouter, LM Studio, Ollama, Together, Groq, or any cloud/local provider that speaks the standard chat completions format
          - listitem [ref=e473]:
            - generic [ref=e475]: •
            - paragraph [ref=e477]:
              - strong [ref=e478]: GitHub Models
              - text: — connect to GitHub's inference API at
              - code [ref=e479]: models.github.ai
              - text: . Enter a GitHub Personal Access Token (PAT) with
              - code [ref=e480]: models:read
              - text: scope, then click
              - strong [ref=e481]: Fetch Models
              - text: to populate the model list from the catalog. Free tier has strict rate limits (50 req/day, 4K input tokens on most models) — enable paid billing in GitHub settings for production-grade limits
          - listitem [ref=e482]:
            - generic [ref=e484]: •
            - paragraph [ref=e486]:
              - strong [ref=e487]: Copilot
              - text: — connect to the GitHub Copilot API at
              - code [ref=e488]: api.githubcopilot.com
              - text: using your existing Copilot subscription (Pro, Pro+, Business, or Enterprise). Click
              - strong [ref=e489]: Sign in with GitHub
              - text: to authenticate via OAuth device flow — the editor opens your browser, you enter the code shown, and the token is saved automatically. Then click
              - strong [ref=e490]: Fetch Models
              - text: to get available models. Uses your Copilot subscription's rate limits and premium request allowance — no separate billing needed

              - strong [ref=e858]: Coder URL
              - text: and
              - strong [ref=e859]: Coder API Key
              - text: if the coder model runs on a different endpoint (e.g. planner on OpenRouter, coder on local Ollama). Leave these empty to use the planner's endpoint for both models
        - paragraph [ref=e860]: Select "No Coder" in the coder dropdown to disable tandem and use a single model. If both dropdowns point to the same model name, tandem is also disabled automatically.
        - paragraph [ref=e861]:
          - strong [ref=e862]: Separate Endpoints (Default Provider Only)
        - paragraph [ref=e863]: "By default, the coder uses the same URL and API key as the planner — just with a different model name in the request. If you want the coder to hit a completely different server:"
        - list [ref=e864]:

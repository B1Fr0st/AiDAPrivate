        - paragraph [ref=e1519]: "When the AI edits a file, it doesn't overwrite your code directly. Every change goes through a diff review:"
        - list [ref=e1520]:
          - listitem [ref=e1521]:
            - generic [ref=e1523]: •
            - paragraph [ref=e1525]:
              - text: Changes are displayed as individual
              - strong [ref=e1526]: hunks
              - text: with green (added) / red (removed) highlighting
          - listitem [ref=e1527]:
            - generic [ref=e1529]: •
            - paragraph [ref=e1531]:
              - text: Navigate between hunks with
              - strong [ref=e1532]: Up / Down
              - text: arrow keys
          - listitem [ref=e1533]:
            - generic [ref=e1535]: •
            - paragraph [ref=e1537]:
              - strong [ref=e1538]: Enter
              - text: — accept the focused hunk
          - listitem [ref=e1539]:
            - generic [ref=e1541]: •
            - paragraph [ref=e1543]:
              - strong [ref=e1544]: Delete
              - text: — reject the focused hunk
          - listitem [ref=e1545]:
            - generic [ref=e1547]: •
            - paragraph [ref=e1549]:
              - strong [ref=e1550]: Ctrl+Shift+A
              - text: — accept all hunks at once
          - listitem [ref=e1551]:
            - generic [ref=e1553]: •
            - paragraph [ref=e1555]:
              - strong [ref=e1556]: Esc
              - text: — reject all remaining hunks
        - paragraph [ref=e1557]:
          - text: The AI can call
          - code [ref=e1558]: wait_for_diff_review
          - text: to pause until you've resolved all pending diffs before it continues. Alternatively, enable
          - strong [ref=e1559]: Auto-accept AI edits
          - text: in settings to skip review entirely.
        - separator [ref=e1560]
        - paragraph [ref=e1561]:
          - strong [ref=e1562]: AI Root
        - paragraph [ref=e1563]: AI Root lets you scope where the AI operates within your project. When set, the AI will only read, write, and browse files within the designated folder(s).
        - paragraph [ref=e1564]:
          - strong [ref=e1565]: Setting an AI Root
        - list [ref=e1566]:
          - listitem [ref=e1567]:
            - generic [ref=e1569]: "1."
            - paragraph [ref=e1571]:
              - text: In the
              - strong [ref=e1572]: File Explorer
              - text: sidebar, right-click any folder
          - listitem [ref=e1573]:
            - generic [ref=e1575]: "2."
            - paragraph [ref=e1577]:
              - text: Click
              - strong [ref=e1578]: AI Root
              - text: to toggle it on or off
          - listitem [ref=e1579]:
            - generic [ref=e1581]: "3."
            - paragraph [ref=e1583]: Folders marked as AI Root show a visual indicator in the tree
        - paragraph [ref=e1584]: You can set multiple AI Roots. When at least one is set, the AI's file operations are restricted to those directories. When no AI Roots are set, the AI can access the entire project.
        - paragraph [ref=e1585]: AI Roots persist across sessions and are saved with your editor state.
        - separator [ref=e1586]
        - paragraph [ref=e1587]:
          - strong [ref=e1588]: Custom Commands
        - paragraph [ref=e1589]:
          - text: Custom Commands let you define named shell commands that integrate into the editor and AI workflow. Define them in
          - strong [ref=e1590]: Settings → Custom Commands
          - text: .
        - paragraph [ref=e1591]:
          - strong [ref=e1592]: Creating a Command
        - list [ref=e1593]:
          - listitem [ref=e1594]:
            - generic [ref=e1596]: "1."
            - paragraph [ref=e1598]:
              - text: Click
              - strong [ref=e1599]: + Add Command
          - listitem [ref=e1600]:
            - generic [ref=e1602]: "2."
            - paragraph [ref=e1604]:
              - text: Enter a
              - strong [ref=e1605]: Name
              - text: (e.g. "Build", "Test", "Deploy")
          - listitem [ref=e1606]:
            - generic [ref=e1608]: "3."
            - paragraph [ref=e1610]:
              - text: Enter a
              - strong [ref=e1611]: Command
              - text: (e.g.
              - code [ref=e1612]: build.bat
              - text: ","
              - code [ref=e1613]: python test.py
              - text: ","
              - code [ref=e1614]: npm run build
              - text: )
          - listitem [ref=e1615]:
            - generic [ref=e1617]: "4."
            - paragraph [ref=e1619]:
              - text: Optionally check
              - strong [ref=e1620]: Use as Bundler
              - text: to replace the toolbar's Bundle button with this command
        - paragraph [ref=e1621]:
          - strong [ref=e1622]: Bundler Override
        - paragraph [ref=e1623]:
          - text: When a custom command has
          - strong [ref=e1624]: Use as Bundler
          - text: enabled, clicking the
          - strong [ref=e1625]: Bundle
          - text: button in the script toolbar will run your custom command in the terminal instead of the built-in
          - code [ref=e1626]: "#include"
          - text: resolver. Only one command can be the active bundler at a time.
        - paragraph [ref=e1627]: This is useful for custom build pipelines — C-preprocessor macro expansion, hash baking, minification, or any project-specific processing the built-in bundler doesn't cover.
        - paragraph [ref=e1628]:
          - strong [ref=e1629]: AI Integration
        - paragraph [ref=e1630]:
          - text: Custom commands are automatically exposed to the AI as the
          - code [ref=e1631]: run_custom_command
          - text: tool. The AI can invoke any of your defined commands by name during agentic workflows. For example, after editing files the AI could run your custom build command to verify compilation.
        - separator [ref=e1632]
        - paragraph [ref=e1633]:
          - strong [ref=e1634]: Extensions
        - paragraph [ref=e1635]: The editor supports AngelScript-based extensions that hook into the editor lifecycle, AI chat pipeline, and provide custom UI widgets. Extensions have full access to the Perception.cx platform API — the same surface available to regular scripts.
        - paragraph [ref=e1636]:
          - strong [ref=e1637]: Installing Extensions
        - paragraph [ref=e1638]:
          - text: Place
          - code [ref=e1639]: .as
          - text: files in the
          - code [ref=e1640]: extensions/
          - text: folder inside your scripting main directory. The editor scans this directory every 3 seconds and automatically picks up new files or removes deleted ones.
        - paragraph [ref=e1641]:
          - strong [ref=e1642]: Managing Extensions
        - paragraph [ref=e1643]:
          - text: Click the 🧩 puzzle icon in the activity bar to open the
          - strong [ref=e1644]: Extensions
          - text: panel. Each extension shows a card with its name, version, description, ON/OFF toggle, Reload button, and any compile errors. Extension state persists across sessions.
        - paragraph [ref=e1645]:
          - strong [ref=e1646]: What Extensions Can Do
        - list [ref=e1647]:
          - listitem [ref=e1648]:
            - generic [ref=e1650]: •
            - paragraph [ref=e1652]:
              - strong [ref=e1653]: Editor events
              - text: — react to files being opened, saved, edited, or tabs switching
          - listitem [ref=e1654]:
            - generic [ref=e1656]: •
            - paragraph [ref=e1658]:
              - strong [ref=e1659]: AI pipeline
              - text: — intercept prompts before sending, inject system prompt text, observe or handle tool calls, register custom AI tools
          - listitem [ref=e1660]:
            - generic [ref=e1662]: •
            - paragraph [ref=e1664]:
              - strong [ref=e1665]: IntelliSense
              - text: — provide custom completions and hover tooltips for any file type (not limited to AngelScript/Lua)
          - listitem [ref=e1666]:
            - generic [ref=e1668]: •
            - paragraph [ref=e1670]:
              - strong [ref=e1671]: Custom UI
              - text: — render checkboxes, sliders, buttons, text inputs, progress bars, dropdowns, color pickers, and keybind capture widgets in the sidebar
          - listitem [ref=e1672]:
            - generic [ref=e1674]: •
            - paragraph [ref=e1676]:
              - strong [ref=e1677]: Editor manipulation
              - text: — insert text, replace selection, set selection range, open files, save files, and jump to lines programmatically
          - listitem [ref=e1678]:
            - generic [ref=e1680]: •
            - paragraph [ref=e1682]:
              - strong [ref=e1683]: File I/O
              - text: — read files, write files, check existence, and list directories from extension code
          - listitem [ref=e1684]:
            - generic [ref=e1686]: •
            - paragraph [ref=e1688]:
              - strong [ref=e1689]: Clipboard
              - text: — get and set system clipboard text
          - listitem [ref=e1690]:
            - generic [ref=e1692]: •
            - paragraph [ref=e1694]:
              - strong [ref=e1695]: Network
              - text: — synchronous HTTP GET/POST requests with custom headers (10s timeout)
          - listitem [ref=e1696]:
            - generic [ref=e1698]: •
            - paragraph [ref=e1700]:
              - strong [ref=e1701]: Platform access
              - text: — use a selection of Perception.cx APIs including rendering, input, CPU intrinsics, WinAPI, JSON, Zydis, and utilities. Process memory, mutexes, and extended math are not available in extensions
        - paragraph [ref=e1702]:
          - strong [ref=e1703]: Validation
        - paragraph [ref=e1704]:
          - text: Extension scripts can be validated using the same
          - code [ref=e1705]: check_script
          - text: and
          - code [ref=e1706]: validate_script
          - text: tools (or the Verify toolbar button). The editor automatically detects that the file is in
          - code [ref=e1707]: extensions/
          - text: and uses a dedicated validator with the extension API surface. Note that
          - code [ref=e1708]: validate_script
          - text: with
          - code [ref=e1709]: run=true
          - text: is not supported for extensions — they are event-driven and have no
          - code [ref=e1710]: main()
          - text: entry point. The
          - code [ref=e1711]: execute_script
          - text: tool also cannot be used with extension code.
        - paragraph [ref=e1712]:
          - text: For the full extension API reference, examples, and hook documentation, see the
          - strong [ref=e1713]: Extension Development
          - text: page.
        - separator [ref=e1714]
        - paragraph [ref=e1715]:
          - strong [ref=e1716]: File Backups & Timeline
        - paragraph [ref=e1717]:
          - text: Every save creates a timestamped backup. The
          - strong [ref=e1718]: Timeline
          - text: "sidebar tab lets you browse and compare backups:"
        - list [ref=e1719]:
          - listitem [ref=e1720]:
            - generic [ref=e1722]: •
            - paragraph [ref=e1724]: All backups for the current file are listed, sorted by date
          - listitem [ref=e1725]:
            - generic [ref=e1727]: •
            - paragraph [ref=e1729]:
              - text: Click any backup to open a
              - strong [ref=e1730]: side-by-side diff view
              - text: comparing it against the current version
          - listitem [ref=e1731]:
            - generic [ref=e1733]: •
            - paragraph [ref=e1735]: Line-level add/remove/change highlighting
          - listitem [ref=e1736]:
            - generic [ref=e1738]: •
            - paragraph [ref=e1740]:
              - text: Configurable
              - strong [ref=e1741]: max backup count
              - text: and
              - strong [ref=e1742]: backup directory
              - text: in settings
          - listitem [ref=e1743]:
            - generic [ref=e1745]: •
            - paragraph [ref=e1747]: Deleted file recovery — the most recent backup of removed files is preserved
        - separator [ref=e1748]
        - paragraph [ref=e1749]:
          - strong [ref=e1750]: Settings
        - paragraph [ref=e1751]:
          - text: All configuration lives in the
          - strong [ref=e1752]: Settings
          - text: sidebar tab (gear icon). Everything persists to disk automatically.
        - paragraph [ref=e1753]:
          - strong [ref=e1754]: Project

        - paragraph [ref=e564]:
          - text: Select your active model from the
          - strong [ref=e565]: filterable dropdown
          - text: at the bottom of the chat panel. Type to search, scroll with the mouse wheel, and click to select. Both planner and coder dropdowns support filtering and scrolling.
        - paragraph [ref=e566]:
          - strong [ref=e567]: Chat Features
        - list [ref=e568]:
          - listitem [ref=e569]:
            - generic [ref=e571]: •
            - paragraph [ref=e573]:
              - strong [ref=e574]: Streaming responses
              - text: with real-time token usage display in the header bar
          - listitem [ref=e575]:
            - generic [ref=e577]: •
            - paragraph [ref=e579]:
              - strong [ref=e580]: Live generation stats
              - text: — while streaming, an animated spinner shows alongside the current speed (
              - code [ref=e581]: ~35 tok/s · 1.3s
              - text: ). After completion, final stats persist below each assistant message (
              - code [ref=e582]: 456 tokens · 99.1 tok/s · 4.6s
              - text: ) using the accurate token count from the API's usage response
          - listitem [ref=e583]:
            - generic [ref=e585]: •
            - paragraph [ref=e587]:
              - strong [ref=e588]: Auto-continue
              - text: — if the model hits its max output token limit mid-response, the editor automatically sends a "Continue" message and resumes streaming. This repeats up to 5 times per user turn, so long analysis sessions (e.g. multi-step reverse engineering) don't require manual intervention
          - listitem [ref=e589]:
            - generic [ref=e591]: •
            - paragraph [ref=e593]:
              - strong [ref=e594]: Full markdown rendering
              - text: — headings, bold/italic, inline code, fenced code blocks with syntax highlighting, tables with word-wrapped cells and per-cell clipping, horizontal rules, lists, and blockquotes
          - listitem [ref=e595]:
            - generic [ref=e597]: •
            - paragraph [ref=e599]:
              - strong [ref=e600]: Thinking / reasoning
              - text: — models that output reasoning tokens get collapsible "Thinking" blocks. When collapsed, an auto-generated summary appears (e.g. "Read 3 files, edited 2 files"). Non-thinking models work normally without the thinking block
          - listitem [ref=e601]:
            - generic [ref=e603]: •
            - generic [ref=e604]:
              - paragraph [ref=e605]:
                - strong [ref=e606]: Conversation management
                - text: "— the dropdown menu offers:"
              - list [ref=e607]:
                - listitem [ref=e608]:
                  - generic [ref=e610]: ◦
                  - paragraph [ref=e612]:
                    - strong [ref=e613]: New Chat
                    - text: — start a fresh conversation
                - listitem [ref=e614]:
                  - generic [ref=e616]: ◦
                  - paragraph [ref=e618]:
                    - strong [ref=e619]: History
                    - text: — browse and load previous chat sessions (tool call badges and results are fully preserved across save/load)
                - listitem [ref=e620]:
                  - generic [ref=e622]: ◦
                  - paragraph [ref=e624]:
                    - strong [ref=e625]: Clear
                    - text: — wipe the current conversation
                - listitem [ref=e626]:
                  - generic [ref=e628]: ◦
                  - paragraph [ref=e630]:
                    - strong [ref=e631]: Summarize & Continue
                    - text: — compress older messages to free up context space. Uses structured summaries that preserve goal, changes made, validation results, pending work, and key technical details
          - listitem [ref=e632]:
            - generic [ref=e634]: •
            - paragraph [ref=e636]:
              - strong [ref=e637]: Automatic context optimization
              - text: — when the assistant fully completes a response (all tool loops finished, no pending follow-ups), older tool results and tool call arguments are automatically trimmed. Large file reads become one-line summaries (e.g.
              - code [ref=e638]: "[Previously read 45 lines from foo.cpp]"
              - text: ), write_file arguments are replaced with compact stubs, and RE tool outputs are condensed. Context is never trimmed mid-loop — the AI keeps full unmodified context for its entire working session
          - listitem [ref=e639]:
            - generic [ref=e641]: •
            - paragraph [ref=e643]:
              - strong [ref=e644]: Tandem AI
              - text: — optionally use two models cooperatively. A planning model handles reasoning and architecture, a coder model handles implementation. See
              - strong [ref=e645]: Tandem AI
              - text: below

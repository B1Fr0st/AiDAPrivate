        - heading "Perception IDE" [level=1] [ref=e147]
        - paragraph [ref=e148]: Script Editor & AI Assistant
      - generic [ref=e149]:
        - paragraph [ref=e150]: Perception.cx ships with a fully integrated code editor and AI assistant. It's a native overlay panel — no Electron, no browser runtime. Write, test, and iterate on scripts without ever leaving the platform.
        - paragraph [ref=e151]: AI chat connects to OpenAI-compatible endpoints, GitHub Models, and GitHub Copilot via OAuth — so your existing Copilot subscription works out of the box.
        - separator [ref=e152]
        - paragraph [ref=e173]:
          - strong [ref=e174]: Editor
        - paragraph [ref=e175]:
          - strong [ref=e176]: Multi-Tab Editing
        - paragraph [ref=e177]: Open as many files as you want. Drag tabs to reorder, middle-click or click the × to close. Each tab tracks its own undo history, cursor position, and unsaved state.
        - paragraph [ref=e178]:
          - strong [ref=e179]: Syntax Highlighting
        - paragraph [ref=e180]: "17 languages are supported: AngelScript, Lua, C/C++, Rust, JavaScript, Python, PHP, HTML, XML, CSS, JSON, Shell, PowerShell, Batch, INI, Markdown, tsx, jsx, vue, go, cs, and log files."
        - paragraph [ref=e181]:
          - strong [ref=e182]: IntelliSense
        - paragraph [ref=e183]:
          - text: Full autocompletion for the Perception.cx API surface in both AngelScript and Lua. Includes function signatures, parameter hints, type info, and namespace-aware resolution (e.g.
          - code [ref=e184]: sdk::player_t
          - text: resolves correctly). Trigger manually with
          - strong [ref=e185]: Ctrl+Space
          - text: or let it appear automatically as you type.
        - paragraph [ref=e186]:
          - strong [ref=e187]: Find & Replace
        - paragraph [ref=e188]:
          - text: Open with
          - strong [ref=e189]: Ctrl+F
          - text: (find) or
          - strong [ref=e190]: Ctrl+H
          - text: (find & replace). Supports regex, case sensitivity, and whole-word matching. Navigate matches with Enter/Shift+Enter or the arrow buttons.

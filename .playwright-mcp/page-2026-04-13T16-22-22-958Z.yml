    - generic [ref=e36]:
      - paragraph [ref=e37]: The Perception Analyzer is an integrated binary analysis tool built into the Perception.cx platform. It provides IDA-style disassembly, a full F5 decompiler, source reconstruction, hex viewing, memory scanning, and structure editing — all operating directly on live processes through Perception's memory access layer.
      - paragraph [ref=e38]: The Analyzer is designed from the ground up for speed. Analysis that takes minutes in traditional tools completes in seconds. Function detection, cross-reference building, string scanning, and decompilation all run in parallel across multiple threads, keeping the UI fully responsive throughout.
      - paragraph [ref=e39]:
        - text: I am also actively working on the
        - strong [ref=e40]: Reconstruct Source
        - text: feature shown in the screenshots below. This feature is still experimental and not yet fully mature, but it is being continuously developed with the goal of becoming a truly state-of-the-art reconstruction system.
      - paragraph [ref=e41]: If this feature interests you and you would like to help improve it, please feel free to share suggestions and bug reports.
      - paragraph [ref=e42]:
        - text: —
        - strong [ref=e43]: Timefall / Admin
      - paragraph [ref=e64]: F5 Decompiler (Advance Decompiler - Generates Pseudo C) - This feature is still under development with ongoing tests and improvements.
      - paragraph [ref=e73]:
        - text: The experimental
        - strong [ref=e74]: Reconstruct Source
        - text: feature generates a full project-style source reconstruction from a binary with a single click.
      - paragraph [ref=e75]: "The output includes:"

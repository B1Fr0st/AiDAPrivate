# ============================================================================
# AiDA License Server — Nginx Reverse Proxy Configuration
# ============================================================================
# Domain: api.aidapro.net
# Server: 23.88.62.199
#
# Installation:
#   sudo cp aida-api.conf /etc/nginx/sites-available/aida-api
#   sudo ln -sf /etc/nginx/sites-available/aida-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL setup (after DNS propagates):
#   sudo certbot --nginx -d api.aidapro.net
# ============================================================================

upstream aida_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Rate limiting zone — 30 req/min per IP for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name api.aidapro.net;

    # Allow ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api.aidapro.net;

    # ── SSL Certificates ────────────────────────────────────────
    # Certbot will auto-modify these after: sudo certbot --nginx -d api.aidapro.net
    # Until then, use self-signed for testing:
    ssl_certificate     /etc/ssl/certs/aida-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/aida-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling (enable after Certbot setup)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ── Security Headers ────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── Request Size Limits ─────────────────────────────────────
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # ── API endpoints (rate limited) ────────────────────────────
    location /validateLicense {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://aida_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://aida_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # ── Health check (no rate limit) ────────────────────────────
    location /health {
        proxy_pass http://aida_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block common exploit paths ──────────────────────────────
    location ~ /\. { deny all; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 404; }

    # ── Catch-all ───────────────────────────────────────────────
    location / {
        return 404;
    }
}
